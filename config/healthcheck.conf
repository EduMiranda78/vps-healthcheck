HC_NETWORK_INCLUDE_INTERFACES="1"
HC_NETWORK_INCLUDE_IPV4="1"
HC_NETWORK_INCLUDE_IPV6="1"
HC_NETWORK_INCLUDE_GATEWAY="1"
HC_NETWORK_INCLUDE_DNS="1"
HC_NETWORK_INCLUDE_ROUTES="1"
HC_NETWORK_INCLUDE_LISTENING_PORTS="1"
HC_NETWORK_INCLUDE_CONNECTIONS="1"
HC_NETWORK_INCLUDE_PUBLIC_IP="1"
HC_NETWORK_INCLUDE_TAILSCALE="1"

