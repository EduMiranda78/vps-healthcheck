HC_KILL_COMMAND_AFTER_SECONDS="5"

# ---------------------------------------------------------------------------
# Módulo de sistema
# ---------------------------------------------------------------------------

HC_SYSTEM_ENABLED="1"

HC_SYSTEM_INCLUDE_HOSTNAME="1"
HC_SYSTEM_INCLUDE_OS="1"
HC_SYSTEM_INCLUDE_KERNEL="1"
HC_SYSTEM_INCLUDE_ARCHITECTURE="1"
HC_SYSTEM_INCLUDE_UPTIME="1"
HC_SYSTEM_INCLUDE_TIMEZONE="1"
HC_SYSTEM_INCLUDE_LOCALE="1"
HC_SYSTEM_INCLUDE_VIRTUALIZATION="1"
HC_SYSTEM_INCLUDE_REBOOT_REQUIRED="1"

