# Módulo de memória
# ---------------------------------------------------------------------------

HC_MEMORY_ENABLED="1"

HC_MEMORY_INCLUDE_TOTAL="1"
HC_MEMORY_INCLUDE_AVAILABLE="1"
HC_MEMORY_INCLUDE_USED="1"
HC_MEMORY_INCLUDE_CACHE="1"
HC_MEMORY_INCLUDE_SWAP="1"
HC_MEMORY_INCLUDE_TOP_PROCESSES="1"

HC_MEMORY_TOP_PROCESSES_LIMIT="20"

