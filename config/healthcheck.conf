#!/usr/bin/env bash

# ---------------------------------------------------------------------------
# vps-healthcheck
# Configuração principal
# ---------------------------------------------------------------------------
#
# Este arquivo é carregado pelo healthcheck.sh.
# Utilize somente atribuições simples no formato:
#
# VARIAVEL="valor"
#
# Não inclua comandos, substituições de comando ou lógica Bash neste arquivo.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Execução geral
# ---------------------------------------------------------------------------

HC_CONFIG_VERSION="1"

HC_DEFAULT_RUN_MODE="quick"
HC_DEFAULT_OUTPUT_FORMATS="terminal,txt"

HC_ENABLE_TERMINAL_OUTPUT="1"
HC_ENABLE_TXT_REPORT="1"
HC_ENABLE_JSON_REPORT="0"
HC_ENABLE_HTML_REPORT="0"

HC_NON_INTERACTIVE="0"
HC_USE_SUDO="1"
HC_KEEP_TEMP_FILES="0"

HC_CONTINUE_ON_OPTIONAL_MODULE_FAILURE="1"
HC_CONTINUE_ON_REQUIRED_MODULE_FAILURE="0"

# ---------------------------------------------------------------------------
# Diretórios
# ---------------------------------------------------------------------------

HC_REPORTS_DIRECTORY="reports"
HC_LOGS_DIRECTORY="logs"
HC_TEMP_DIRECTORY=""

HC_CREATE_EXECUTION_SUBDIRECTORY="1"
HC_REPORT_DIRECTORY_MODE="0750"
HC_REPORT_FILE_MODE="0640"
HC_LOG_DIRECTORY_MODE="0750"
HC_LOG_FILE_MODE="0640"

# ---------------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------------

HC_LOG_LEVEL="INFO"
HC_LOG_TO_FILE="1"
HC_LOG_TO_STDOUT="0"

HC_LOG_INCLUDE_TIMESTAMP="1"
HC_LOG_INCLUDE_PID="1"
HC_LOG_INCLUDE_SOURCE="1"

HC_LOG_MAX_SIZE_BYTES="10485760"
HC_LOG_ROTATION_COUNT="5"

HC_LOG_COMMAND_OUTPUT="0"
HC_LOG_SKIPPED_CHECKS="1"

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------

HC_COLOR_MODE="auto"
HC_UNICODE_MODE="auto"

HC_TERMINAL_SHOW_HEADER="1"
HC_TERMINAL_SHOW_SUMMARY="1"
HC_TERMINAL_SHOW_ALERTS="1"
HC_TERMINAL_SHOW_SKIPPED_MODULES="1"
HC_TERMINAL_SHOW_UNKNOWN_VALUES="1"

HC_TERMINAL_LABEL_WIDTH="28"
HC_TERMINAL_TABLE_MAX_ROWS="50"

# ---------------------------------------------------------------------------
# Privacidade
# ---------------------------------------------------------------------------

HC_REDACT_SECRETS="1"
HC_REDACT_PUBLIC_IP="0"
HC_REDACT_PRIVATE_IP="0"
HC_REDACT_HOSTNAME="0"
HC_REDACT_USERNAMES="0"
HC_REDACT_DOMAINS="0"

HC_INCLUDE_COMMAND_LINES="1"
HC_INCLUDE_PROCESS_ENVIRONMENT="0"
HC_INCLUDE_SENSITIVE_CONFIG_VALUES="0"

# ---------------------------------------------------------------------------
# Comandos e tempo limite
# ---------------------------------------------------------------------------

HC_COMMAND_TIMEOUT_SECONDS="30"
HC_LONG_COMMAND_TIMEOUT_SECONDS="300"

HC_HTTP_CONNECT_TIMEOUT_SECONDS="5"
HC_HTTP_TOTAL_TIMEOUT_SECONDS="10"
