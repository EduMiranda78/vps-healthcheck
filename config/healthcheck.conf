# ---------------------------------------------------------------------------

HC_CPU_ENABLED="1"

HC_CPU_INCLUDE_MODEL="1"
HC_CPU_INCLUDE_ARCHITECTURE="1"
HC_CPU_INCLUDE_CORES="1"
HC_CPU_INCLUDE_THREADS="1"
HC_CPU_INCLUDE_FREQUENCY="1"
HC_CPU_INCLUDE_LOAD_AVERAGE="1"
HC_CPU_INCLUDE_USAGE="1"
HC_CPU_INCLUDE_TOP_PROCESSES="1"
HC_CPU_INCLUDE_TEMPERATURE="1"

HC_CPU_SAMPLE_SECONDS="1"
